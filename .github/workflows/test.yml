name: API Test Automation

# 触发条件：当推送代码到 main 分支，或向 main 分支提交 PR 时自动运行
on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test:
    permissions:
      contents: write # 🌟 允许流水线向仓库写文件
    # 指定使用 GitHub 提供的最新的 Ubuntu 虚拟机
    runs-on: ubuntu-latest

    # 🌟 核心魔法 1：在云端自动拉起一个真实的 MySQL 容器
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: 123456
          MYSQL_DATABASE: ecommerce
        # 将容器的 3306 端口映射到宿主机的 3307 端口（与你本地 Docker 保持一致）
        ports:
          - 3307:3306
        # 健康检查：GitHub 会反复执行 mysqladmin ping，直到 MySQL 彻底初始化完成，才会执行后面的步骤
        options: >-
          --health-cmd="mysqladmin ping -h localhost -p123456"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    # 🌟 核心魔法 2：注入全局环境变量（代替你本地的 .env 文件）
    # 这样你的 Python 代码无论是在本地还是云端，都能通过 os.getenv() 读取到统一配置
    env:
      ENV: dev
      BASE_URL: http://127.0.0.1:8081
      DB_HOST: 127.0.0.1
      DB_PORT: 3307
      DB_USER: root
      DB_PASSWORD: 123456

    steps:
      # 步骤 1：拉取你的代码到云端虚拟机
      - name: Checkout code
        uses: actions/checkout@v4

      # 步骤 2：配置 Python 运行环境
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # 步骤 3：安装 requirements.txt 里的所有依赖包
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # 步骤 4：启动靶机后端服务
      - name: Start Server
        run: |
          cd mock_server
          nohup uvicorn real_server:app --port 8081 > uvicorn.log 2>&1 &
          cd ..
          echo "正在等待服务器启动..."
          for i in {1..10}; do
            if curl -s http://127.0.0.1:8081/docs > /dev/null; then
              echo "✅ 靶机启动成功！"
              break
            fi
            sleep 1
          done

      # 步骤 5：执行测试（允许失败，为了看后面的日志）
      - name: Run Pytest
        id: run_pytest
        continue-on-error: true
        run: |
          pytest tests/ecommerce/ -v

      # 步骤 6：强制打印后端日志！
      - name: Print Backend Log
        if: always()
        run: |
          echo "=========================================="
          echo "========= 后端的真实运行日志 ========="
          echo "=========================================="
          cat mock_server/uvicorn.log
      
      # 步骤 7：如果测试真的失败了，让流水线变红
      - name: Fail if tests failed
        if: steps.run_pytest.outcome == 'failure'
        run: exit 1

      # 步骤 8：生成 Allure 报告
      # 注意：if: always() 表示不管测试跑没跑绿，都要生成报告（方便排查 Bug）
      - name: Generate Allure Report
        if: always()
        run: |
          # 下载 Allure 命令行工具
          wget https://github.com/allure-framework/allure2/releases/download/2.27.0/allure-2.27.0.tgz
          tar -zxvf allure-2.27.0.tgz
          sudo mv allure-2.27.0 /opt/allure
          sudo ln -s /opt/allure/bin/allure /usr/local/bin/allure
          
          # 将 allure-results 里的原始数据转换成精美的 HTML 网页报告
          allure generate ./allure-results -o ./allure-report --clean
          # 🌟 新增这一行：创建 .nojekyll 文件，阻止 GitHub 篡改你的样式
          touch ./allure-report/.nojekyll

      # 步骤 9：将 HTML 报告打包，上传到 GitHub 页面供下载
      - name: Upload Allure Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-test-report
          path: ./allure-report
      
      # 🌟 核心新增：将 Allure 报告部署到 GitHub Pages
      - name: Deploy to GitHub Pages
        if: always() # 即使测试挂了，也要更新网页上的报告，方便排查
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./allure-report # 告诉它你要发布的网页文件夹是哪个
          publish_branch: gh-pages     # 告诉它把网页推到 gh-pages 这个专门的分支上
          force_orphan: true           # 保证每次都是干净的发布，不保留历史垃圾