name: API Test Automation

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # 🌟 核心步骤：启动云端靶机（绝对不能再少这步了！）
      - name: Start Mock Server
        run: |
          cd mock_server
          # nohup 确保即使当前终端结束，后台服务也不会死掉
          nohup uvicorn mock_server:app --port 8080 > uvicorn.log 2>&1 &
          # 睡眠 5 秒，给服务器充足的时间准备数据库
          sleep 5

      # 🎯 只跑用户流测试
      - name: Run pytest
        run: pytest tests/test_user_flow.py -v