# data/ecommerce_items.yaml
# 商品发布参数边界数据
# unique: true  → 用例会自动追加时间戳，保证名字唯一（用于正向流）
# unique: false → 原样提交，专测边界（空名、超长名等不能被加工）
- case_name: "正常价格商品"
  name: "正常商品"
  price: 18.5
  expected_code: 200
  unique: true

- case_name: "免费商品"
  name: "免费商品"
  price: 0
  expected_code: 422
  unique: false

- case_name: "负数商品"
  name: "负数商品"
  price: -10.5
  expected_code: 422
  unique: false

- case_name: "超长商品名称"
  name: "这是超长名字这是超长名字这是超长名字这是超长名字这是超长名字这是超长名字这是超长名字这是超长名字这是超长名字这是超长名字这是超长名字这是超长名字"
  price: 10.0
  expected_code: 422
  unique: false

- case_name: "空商品名称"
  name: ""
  price: 10.0
  expected_code: 422
  unique: false

- case_name: "表情符号商品"
  name: "🔥爆款🔥"
  price: 10.0
  expected_code: 200
  unique: true
